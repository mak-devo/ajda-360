<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJDA — 360° Virtual Tour</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"
/>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,Helvetica,sans-serif;
}

#tour{
  position:fixed;
  inset:0;
}

/* =========================
   INTRO
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .8s ease, visibility .8s ease;
}

#intro.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-content{
  text-align:center;
}

.intro-logo{
  width:min(300px,60vw);
  max-height:120px;
  object-fit:contain;
}

.intro-line{
  width:45px;
  height:1px;
  background:rgba(255,255,255,.55);
  margin:25px auto 18px;
}

.intro-title{
  color:rgba(255,255,255,.7);
  font-size:10px;
  letter-spacing:.3em;
  text-transform:uppercase;
}

.enter-button{
  margin-top:28px;
  padding:13px 24px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:.25s;
}

.enter-button:hover{
  background:rgba(255,255,255,.15);
  transform:translateY(-2px);
}


/* =========================
   TOP BAR
========================= */

.topbar{
  position:fixed;
  z-index:30;
  top:18px;
  left:18px;
  right:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  transition:opacity .4s;
}

.topbar.hidden{
  opacity:0;
  pointer-events:none;
}

.logo-box,
.scene-box,
.controls{
  background:rgba(10,12,14,.55);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.logo-box{
  padding:9px 13px;
  border-radius:12px;
}

.logo-box img{
  display:block;
  height:24px;
  width:auto;
}

.scene-box{
  padding:9px 14px;
  border-radius:50px;
  color:white;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.controls{
  display:flex;
  gap:4px;
  padding:5px;
  border-radius:12px;
}

.control{
  width:36px;
  height:32px;
  border:0;
  background:transparent;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

.control:hover{
  background:rgba(255,255,255,.12);
}


/* =========================
   WAYPOINT
========================= */

#waypoint{
  position:fixed;
  z-index:25;

  width:76px;
  height:76px;

  transform:translate(-50%,-50%);

  display:none;

  cursor:pointer;

  pointer-events:auto;

  transition:
    left .15s linear,
    top .15s linear,
    opacity .3s;
}

#waypoint.visible{
  display:block;
}

.waypoint-ring{
  position:absolute;
  inset:5px;

  border-radius:50%;

  background:rgba(15,15,15,.45);

  border:1px solid rgba(255,255,255,.9);

  backdrop-filter:blur(8px);

  box-shadow:
    0 0 0 0 rgba(255,255,255,.4);

  animation:pulse 2s infinite;
}

.waypoint-arrow{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-size:26px;

  text-shadow:
    0 2px 8px rgba(0,0,0,.8);
}

.waypoint-label{
  position:absolute;

  top:82px;
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  padding:8px 13px;

  border-radius:30px;

  color:white;

  background:rgba(10,12,14,.7);

  border:1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(12px);

  font-size:9px;

  letter-spacing:.14em;

  text-transform:uppercase;
}

@keyframes pulse{

  0%{
    box-shadow:
      0 0 0 0 rgba(255,255,255,.35);
  }

  70%{
    box-shadow:
      0 0 0 16px rgba(255,255,255,0);
  }

  100%{
    box-shadow:
      0 0 0 0 rgba(255,255,255,0);
  }

}


/* =========================
   TRANSITION
========================= */

#transition{
  position:fixed;
  inset:-10%;

  z-index:90;

  pointer-events:none;

  opacity:0;

  background:rgba(0,0,0,.2);

  backdrop-filter:blur(0);
  -webkit-backdrop-filter:blur(0);

  transform:scale(1);
}

#transition.animate{
  animation:travel .9s ease-in-out forwards;
}

@keyframes travel{

  0%{
    opacity:0;
    backdrop-filter:blur(0);
    transform:scale(1);
  }

  35%{
    opacity:1;
    backdrop-filter:blur(11px);
    transform:scale(1.04);
  }

  70%{
    opacity:1;
    backdrop-filter:blur(7px);
    transform:scale(1.02);
  }

  100%{
    opacity:0;
    backdrop-filter:blur(0);
    transform:scale(1);
  }

}


/* =========================
   HINT
========================= */

#hint{
  position:fixed;

  z-index:20;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  padding:9px 14px;

  border-radius:30px;

  color:rgba(255,255,255,.7);

  background:rgba(10,12,14,.5);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(12px);

  font-size:9px;

  letter-spacing:.12em;

  text-transform:uppercase;

  transition:opacity .4s;
}

#hint.hidden{
  opacity:0;
}


/* Hide Pannellum default controls */

.pnlm-controls-container{
  display:none !important;
}

.pnlm-about-msg{
  display:none !important;
}


/* MOBILE */

@media(max-width:700px){

  .topbar{
    top:10px;
    left:10px;
    right:10px;
  }

  .scene-box{
    display:none;
  }

  .logo-box img{
    height:21px;
  }

  #hint{
    bottom:17px;
  }

}

</style>
</head>


<body>


<!-- =========================
     PANORAMA
========================= -->

<div id="tour"></div>


<!-- =========================
     WAYPOINT
========================= -->

<div id="waypoint">

  <div class="waypoint-ring"></div>

  <div class="waypoint-arrow">
    ➜
  </div>

  <div class="waypoint-label" id="waypointLabel">
    Enter space
  </div>

</div>


<!-- =========================
     TRANSITION
========================= -->

<div id="transition"></div>


<!-- =========================
     INTRO
========================= -->

<div id="intro">

  <div class="intro-content">

    <img
      src="Ajda.png"
      class="intro-logo"
      alt="AJDA"
    >

    <div class="intro-line"></div>

    <div class="intro-title">
      Interactive 360° Experience
    </div>

    <button
      class="enter-button"
      id="enterButton"
    >
      Enter Experience
    </button>

  </div>

</div>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar" id="topbar">

  <div class="logo-box">

    <img
      src="Ajda.png"
      alt="AJDA"
    >

  </div>


  <div
    class="scene-box"
    id="sceneTitle"
  >
    Exterior
  </div>


  <div class="controls">

    <button
      class="control"
      id="resetButton"
      title="Reset view"
    >
      ⌂
    </button>

    <button
      class="control"
      id="fullscreenButton"
      title="Fullscreen"
    >
      ⛶
    </button>

  </div>

</div>


<div id="hint">
  Drag to explore · Click the waypoint to enter
</div>



<script>


/* =========================================================
   SCENES
========================================================= */

const scenes = {

  exterior:{

    image:"out360.png",

    title:"Exterior",

    yaw:-9.14,

    pitch:-9.07,

    hfov:95,

    waypointYaw:-9.14,

    waypointPitch:-9.07,

    target:"interior"

  },


  interior:{

    image:"Ajda360.png",

    title:"Interior",

    yaw:171.04,

    pitch:-18.68,

    hfov:92,

    waypointYaw:171.04,

    waypointPitch:-18.68,

    target:"exterior"

  }

};


/* =========================================================
   STATE
========================================================= */

let currentScene="exterior";

let viewer=null;

let travelling=false;


/* =========================================================
   CREATE VIEWER
========================================================= */

function createViewer(sceneName){

  const scene=scenes[sceneName];


  if(viewer){

    viewer.destroy();

  }


  viewer=pannellum.viewer(
    "tour",
    {

      type:"equirectangular",

      panorama:scene.image,

      autoLoad:true,

      showControls:false,

      mouseZoom:true,

      keyboardZoom:true,

      draggable:true,

      friction:.15,

      hfov:scene.hfov,

      minHfov:50,

      maxHfov:120,

      yaw:scene.yaw,

      pitch:scene.pitch,

      sceneFadeDuration:0

    }
  );


  viewer.on(
    "load",
    function(){

      updateWaypoint();

    }
  );

}


/* =========================================================
   POSITION WAYPOINT
========================================================= */

function updateWaypoint(){

  if(!viewer) return;


  const scene=scenes[currentScene];

  const waypoint=document.getElementById("waypoint");


  /*
    Pannellum gives us the screen position
    of a panorama coordinate.
  */

  const position=viewer.mouseEventToCoords({

    clientX:window.innerWidth/2,
    clientY:window.innerHeight/2

  });


  /*
    Convert the waypoint yaw/pitch
    to screen coordinates.
  */

  const centerYaw=viewer.getYaw();

  const centerPitch=viewer.getPitch();

  const hfov=viewer.getHfov();


  let yawDifference=
    scene.waypointYaw-centerYaw;


  while(yawDifference>180)
    yawDifference-=360;

  while(yawDifference<-180)
    yawDifference+=360;


  /*
    Horizontal field relationship.
  */

  const x=
    window.innerWidth/2 +
    (
      yawDifference / hfov
    ) *
    window.innerWidth;


  /*
    Vertical approximation.
  */

  const verticalFov=
    hfov *
    window.innerHeight /
    window.innerWidth;


  const y=
    window.innerHeight/2 -
    (
      (scene.waypointPitch-centerPitch)
      /
      verticalFov
    ) *
    window.innerHeight;


  /*
    Don't show if the waypoint is
    behind the camera.
  */

  const front=
    Math.cos(
      yawDifference*Math.PI/180
    ) > 0;


  if(
    front &&
    x>-100 &&
    x<window.innerWidth+100 &&
    y>-100 &&
    y<window.innerHeight+100
  ){

    waypoint.style.left=x+"px";

    waypoint.style.top=y+"px";

    waypoint.classList.add("visible");

  }else{

    waypoint.classList.remove("visible");

  }

}


/* =========================================================
   UPDATE WAYPOINT WHILE MOVING
========================================================= */

setInterval(

  function(){

    if(viewer && !travelling){

      updateWaypoint();

    }

  },

  50

);


/* =========================================================
   TRAVEL
========================================================= */

function travel(){

  if(travelling) return;

  travelling=true;


  const scene=scenes[currentScene];

  const target=scene.target;

  const transition=
    document.getElementById("transition");

  const waypoint=
    document.getElementById("waypoint");

  const topbar=
    document.getElementById("topbar");


  waypoint.classList.remove("visible");

  topbar.classList.add("hidden");


  /*
    First move camera toward
    the waypoint.
  */

  viewer.lookAt(

    scene.waypointPitch,

    scene.waypointYaw,

    Math.max(
      60,
      scene.hfov-18
    ),

    550

  );


  setTimeout(

    function(){

      transition.classList.remove("animate");

      void transition.offsetWidth;

      transition.classList.add("animate");


      setTimeout(

        function(){

          currentScene=target;

          const next=scenes[target];


          createViewer(target);


          document.getElementById(
            "sceneTitle"
          ).textContent=next.title;


          document.getElementById(
            "waypointLabel"
          ).textContent=
            target==="interior"
            ? "Enter space"
            : "Return outside";


          setTimeout(

            function(){

              if(viewer){

                viewer.lookAt(

                  next.pitch,

                  next.yaw,

                  next.hfov,

                  0

                );

              }


              topbar.classList.remove("hidden");

              travelling=false;

              updateWaypoint();

            },

            700

          );

        },

        420

      );

    },

    500

  );

}


/* =========================================================
   WAYPOINT CLICK
========================================================= */

document
  .getElementById("waypoint")
  .addEventListener(

    "click",

    function(e){

      e.stopPropagation();

      travel();

    }

  );


/* =========================================================
   INTRO
========================================================= */

document
  .getElementById("enterButton")
  .addEventListener(

    "click",

    function(){

      document
        .getElementById("intro")
        .classList
        .add("hidden");


      setTimeout(

        function(){

          document
            .getElementById("hint")
            .classList
            .add("hidden");

        },

        3500

      );

    }

  );


/* =========================================================
   RESET
========================================================= */

document
  .getElementById("resetButton")
  .addEventListener(

    "click",

    function(){

      const scene=scenes[currentScene];


      viewer.lookAt(

        scene.pitch,

        scene.yaw,

        scene.hfov,

        800

      );

    }

  );


/* =========================================================
   FULLSCREEN
========================================================= */

document
  .getElementById("fullscreenButton")
  .addEventListener(

    "click",

    function(){

      if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

      }else{

        document.exitFullscreen();

      }

    }

  );


/* =========================================================
   UPDATE ON RESIZE
========================================================= */

window.addEventListener(

  "resize",

  function(){

    updateWaypoint();

  }

);


/* =========================================================
   START
========================================================= */

createViewer("exterior");


</script>

</body>
</html>
