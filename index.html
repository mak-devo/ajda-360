<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AJDA — 360° Virtual Experience</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

<script
src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
</script>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Inter,Arial,sans-serif;
}

#tour{
  position:fixed;
  inset:0;
}

/* =================================
   INTRO
================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#070707;
  transition:opacity .9s ease,visibility .9s;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-content{
  text-align:center;
}

.intro-logo{
  width:min(300px,60vw);
  max-height:120px;
  object-fit:contain;
}

.intro-line{
  width:45px;
  height:1px;
  margin:25px auto 18px;
  background:rgba(255,255,255,.5);
}

.intro-label{
  color:rgba(255,255,255,.68);
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
}

.enter{
  margin-top:28px;
  padding:13px 25px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  transition:.25s;
}

.enter:hover{
  background:rgba(255,255,255,.14);
  transform:translateY(-2px);
}

.loading-text{
  margin-top:18px;
  color:rgba(255,255,255,.38);
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
}


/* =================================
   TOP BAR
================================= */

.topbar{
  position:fixed;
  z-index:30;
  top:18px;
  left:18px;
  right:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  transition:opacity .45s;
}

.topbar.hidden{
  opacity:0;
  pointer-events:none;
}

.glass{
  background:rgba(10,12,14,.52);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.logo{
  padding:9px 13px;
  border-radius:12px;
}

.logo img{
  display:block;
  height:23px;
  width:auto;
}

.scene{
  padding:9px 14px;
  border-radius:30px;
  color:rgba(255,255,255,.85);
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.controls{
  display:flex;
  gap:4px;
  padding:5px;
  border-radius:12px;
}

.control{
  width:36px;
  height:32px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.control:hover,
.control.active{
  background:rgba(255,255,255,.13);
}


/* =================================
   COMPASS
================================= */

#compass{
  position:fixed;
  z-index:20;

  left:50%;
  top:20px;

  transform:translateX(-50%);

  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-size:10px;

  background:rgba(10,12,14,.42);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(15px);

  transition:opacity .4s;
}

#compass.hidden{
  opacity:0;
}


/* =================================
   GROUND WAYPOINT
================================= */

#waypoint{

  position:fixed;

  z-index:25;

  width:54px;
  height:34px;

  display:none;

  transform:
    translate(-50%,-50%)
    rotateX(58deg)
    rotateZ(-45deg);

  cursor:pointer;

  filter:
    drop-shadow(0 4px 5px rgba(0,0,0,.45));

  transition:
    left .12s linear,
    top .12s linear,
    opacity .25s;

}

#waypoint.visible{
  display:block;
}

.arrow-shape{

  width:38px;
  height:38px;

  position:absolute;

  left:8px;
  top:-2px;

  border-top:3px solid rgba(255,255,255,.95);
  border-right:3px solid rgba(255,255,255,.95);

  transform:rotate(-45deg);

}

.arrow-base{

  position:absolute;

  width:30px;
  height:5px;

  left:13px;
  top:17px;

  border-radius:5px;

  background:rgba(255,255,255,.9);

}

.waypoint-shadow{

  position:absolute;

  left:5px;
  right:5px;
  bottom:-6px;

  height:5px;

  border-radius:50%;

  background:rgba(0,0,0,.35);

  filter:blur(3px);

}


/* =================================
   TRANSITION
================================= */

#transition{

  position:fixed;

  inset:-8%;

  z-index:90;

  pointer-events:none;

  opacity:0;

  background:rgba(0,0,0,.16);

  backdrop-filter:blur(0);

  -webkit-backdrop-filter:blur(0);

  transform:scale(1);

}

#transition.go{

  animation:travel .9s cubic-bezier(.65,0,.2,1) forwards;

}

@keyframes travel{

  0%{
    opacity:0;
    backdrop-filter:blur(0);
    transform:scale(1);
  }

  35%{
    opacity:1;
    backdrop-filter:blur(10px);
    transform:scale(1.045);
  }

  70%{
    opacity:1;
    backdrop-filter:blur(7px);
    transform:scale(1.025);
  }

  100%{
    opacity:0;
    backdrop-filter:blur(0);
    transform:scale(1);
  }

}


/* =================================
   HINT
================================= */

#hint{

  position:fixed;

  z-index:20;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  padding:9px 14px;

  border-radius:30px;

  background:rgba(10,12,14,.48);

  border:1px solid rgba(255,255,255,.14);

  backdrop-filter:blur(14px);

  color:rgba(255,255,255,.65);

  font-size:9px;

  letter-spacing:.12em;

  text-transform:uppercase;

  transition:opacity .5s;

}

#hint.hide{
  opacity:0;
}


/* =================================
   INITIAL LOADING
================================= */

#loading{

  position:fixed;

  z-index:80;

  left:50%;
  bottom:70px;

  transform:translateX(-50%);

  color:rgba(255,255,255,.6);

  font-size:9px;

  letter-spacing:.13em;

  text-transform:uppercase;

  transition:opacity .5s;

}

#loading.hide{
  opacity:0;
}


/* Hide Pannellum controls */

.pnlm-controls-container{
  display:none!important;
}

.pnlm-about-msg{
  display:none!important;
}


/* =================================
   MOBILE
================================= */

@media(max-width:700px){

  .topbar{
    top:10px;
    left:10px;
    right:10px;
  }

  .scene{
    display:none;
  }

  .logo img{
    height:21px;
  }

  #compass{
    top:68px;
  }

  #hint{
    bottom:18px;
  }

}

</style>
</head>


<body>


<div id="tour"></div>


<!-- WAYPOINT -->

<div id="waypoint">

  <div class="waypoint-shadow"></div>

  <div class="arrow-shape"></div>

  <div class="arrow-base"></div>

</div>


<!-- TRANSITION -->

<div id="transition"></div>


<!-- LOADING -->

<div id="loading">
  Preparing 360° Experience…
</div>


<!-- INTRO -->

<div id="intro">

  <div class="intro-content">

    <img
      src="Ajda.png"
      class="intro-logo"
      alt="AJDA"
    >

    <div class="intro-line"></div>

    <div class="intro-label">
      Interactive 360° Experience
    </div>

    <button
      class="enter"
      id="enter"
    >
      Enter Experience
    </button>

    <div class="loading-text">
      360° environment
    </div>

  </div>

</div>


<!-- TOP BAR -->

<div
  class="topbar"
  id="topbar"
>

  <div class="logo glass">

    <img
      src="Ajda.png"
      alt="AJDA"
    >

  </div>


  <div
    class="scene glass"
    id="scene"
  >
    Exterior
  </div>


  <div class="controls glass">

    <button
      class="control"
      id="motion"
      title="Enable motion"
    >
      ◉
    </button>

    <button
      class="control"
      id="reset"
      title="Reset"
    >
      ⌂
    </button>

    <button
      class="control"
      id="fullscreen"
      title="Fullscreen"
    >
      ⛶
    </button>

  </div>

</div>


<!-- COMPASS -->

<div id="compass">
  N
</div>


<div id="hint">
  Drag to explore · Tap the arrow to enter
</div>


<script>


/* ==============================================
   SCENES
============================================== */

const scenes={

  exterior:{

    image:"out360.png",

    title:"Exterior",

    yaw:-9.14,

    pitch:-9.07,

    hfov:95,

    waypointYaw:-9.14,

    waypointPitch:-9.07,

    target:"interior"

  },

  interior:{

    image:"Ajda360.png",

    title:"Interior",

    yaw:171.04,

    pitch:-18.68,

    hfov:92,

    waypointYaw:171.04,

    waypointPitch:-18.68,

    target:"exterior"

  }

};


/* ==============================================
   STATE
============================================== */

let current="exterior";

let viewer=null;

let travelling=false;

let motionEnabled=false;


/* ==============================================
   PRELOAD BOTH PANORAMAS
============================================== */

function preloadImages(){

  const images=[

    "out360.png",

    "Ajda360.png",

    "Ajda.png"

  ];

  images.forEach(src=>{

    const img=new Image();

    img.src=src;

  });

}


/* Start background loading immediately */

preloadImages();


/* ==============================================
   CREATE VIEWER
============================================== */

function createViewer(sceneName){

  const s=scenes[sceneName];


  if(viewer){

    viewer.destroy();

  }


  viewer=pannellum.viewer(

    "tour",

    {

      type:"equirectangular",

      panorama:s.image,

      autoLoad:true,

      showControls:false,

      mouseZoom:true,

      keyboardZoom:true,

      draggable:true,

      friction:.15,

      hfov:s.hfov,

      minHfov:50,

      maxHfov:120,

      yaw:s.yaw,

      pitch:s.pitch,

      sceneFadeDuration:0

    }

  );


  viewer.on(

    "load",

    ()=>{

      document
        .getElementById("loading")
        .classList
        .add("hide");

      updateWaypoint();

      updateCompass();

    }

  );

}


/* ==============================================
   WAYPOINT POSITION
============================================== */

function updateWaypoint(){

  if(!viewer || travelling)return;


  const s=scenes[current];

  const waypoint=
    document.getElementById("waypoint");


  const yaw=
    viewer.getYaw();

  const pitch=
    viewer.getPitch();

  const hfov=
    viewer.getHfov();


  let difference=
    s.waypointYaw-yaw;


  while(difference>180)
    difference-=360;

  while(difference<-180)
    difference+=360;


  /*
    Keep waypoint within
    the front hemisphere.
  */

  const visible=
    Math.abs(difference)<72;


  if(!visible){

    waypoint.classList.remove("visible");

    return;

  }


  const x=
    window.innerWidth/2+
    (
      difference/hfov
    )*
    window.innerWidth;


  const verticalFov=
    hfov*
    window.innerHeight/
    window.innerWidth;


  const y=
    window.innerHeight/2-
    (
      (s.waypointPitch-pitch)/
      verticalFov
    )*
    window.innerHeight;


  /*
    Ground adjustment.
  */

  const groundOffset=
    Math.min(
      90,
      Math.max(
        0,
        (y-window.innerHeight/2)*.15
      )
    );


  waypoint.style.left=
    x+"px";

  waypoint.style.top=
    (y+groundOffset)+"px";


  waypoint.classList.add("visible");

}


/* ==============================================
   UPDATE FREQUENTLY
============================================== */

setInterval(

  ()=>{

    if(viewer && !travelling){

      updateWaypoint();

      updateCompass();

    }

  },

  60

);


/* ==============================================
   COMPASS
============================================== */

function updateCompass(){

  if(!viewer)return;

  const yaw=viewer.getYaw();

  let direction=
    Math.round(
      ((yaw%360)+360)%360
    );

  const compass=
    document.getElementById("compass");

  compass.style.transform=
    `translateX(-50%) rotate(${-direction}deg)`;

}


/* ==============================================
   TRAVEL
============================================== */

function travel(){

  if(travelling)return;


  travelling=true;


  const s=scenes[current];

  const target=s.target;

  const transition=
    document.getElementById("transition");

  const waypoint=
    document.getElementById("waypoint");

  const topbar=
    document.getElementById("topbar");


  waypoint.classList.remove("visible");

  topbar.classList.add("hidden");


  /*
    Move toward entrance.
  */

  viewer.lookAt(

    s.waypointPitch,

    s.waypointYaw,

    Math.max(
      62,
      s.hfov-16
    ),

    500

  );


  setTimeout(

    ()=>{

      transition.classList.remove("go");

      void transition.offsetWidth;

      transition.classList.add("go");


      setTimeout(

        ()=>{

          current=target;


          const next=
            scenes[target];


          createViewer(target);


          document
            .getElementById("scene")
            .textContent=
            next.title;


          setTimeout(

            ()=>{

              if(viewer){

                viewer.lookAt(

                  next.pitch,

                  next.yaw,

                  next.hfov,

                  0

                );

              }


              topbar.classList.remove("hidden");

              travelling=false;

              updateWaypoint();

              updateCompass();

            },

            650

          );

        },

        360

      );

    },

    500

  );

}


/* ==============================================
   WAYPOINT CLICK
============================================== */

document
  .getElementById("waypoint")
  .addEventListener(

    "click",

    e=>{

      e.stopPropagation();

      travel();

    }

  );


/* ==============================================
   INTRO
============================================== */

document
  .getElementById("enter")
  .addEventListener(

    "click",

    ()=>{

      document
        .getElementById("intro")
        .classList
        .add("hide");


      document
        .getElementById("hint")
        .classList
        .remove("hide");

    }

  );


/* ==============================================
   RESET
============================================== */

document
  .getElementById("reset")
  .addEventListener(

    "click",

    ()=>{

      const s=scenes[current];

      viewer.lookAt(

        s.pitch,

        s.yaw,

        s.hfov,

        800

      );

    }

  );


/* ==============================================
   FULLSCREEN
============================================== */

document
  .getElementById("fullscreen")
  .addEventListener(

    "click",

    ()=>{

      if(!document.fullscreenElement){

        document
          .documentElement
          .requestFullscreen?.();

      }else{

        document
          .exitFullscreen?.();

      }

    }

  );


/* ==============================================
   GYROSCOPE
============================================== */

async function enableMotion(){

  /*
    iOS requires permission.
  */

  if(
    typeof DeviceOrientationEvent!=="undefined" &&
    typeof DeviceOrientationEvent.requestPermission==="function"
  ){

    try{

      const permission=
        await DeviceOrientationEvent
        .requestPermission();

      if(permission!=="granted"){

        alert(
          "Motion access was not allowed."
        );

        return;

      }

    }catch(error){

      return;

    }

  }


  motionEnabled=true;


  document
    .getElementById("motion")
    .classList
    .add("active");


  /*
    Pannellum orientation control.
  */

  if(
    viewer &&
    viewer.startOrientationControl
  ){

    viewer.startOrientationControl();

  }

}


/* ==============================================
   MOTION BUTTON
============================================== */

document
  .getElementById("motion")
  .addEventListener(

    "click",

    enableMotion

  );


/* ==============================================
   RESIZE
============================================== */

window.addEventListener(

  "resize",

  ()=>{

    updateWaypoint();

  }

);


/* ==============================================
   START
============================================== */

createViewer("exterior");


</script>

</body>
</html>
